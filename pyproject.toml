[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyddrv"
version = "0.1.0"
description = "Data-Driven Recurrence-based Verification: certify stability and regions of attraction from sampled trajectory data via Recurrent Lyapunov Functions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Enrique Mallada" },
    { name = "NetDLab (Networks, Dynamics, and Learning Laboratory)" },
]
keywords = [
    "control", "verification", "Lyapunov", "recurrence",
    "data-driven", "stability", "region-of-attraction", "dynamical-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Accelerated compute core (the fused certifier kernel). Install one
# matching your hardware; without it the NumPy kernel is used.
jax = ["jax>=0.4.30"]
jax-cuda = ["jax[cuda12]>=0.4.30"]
# GPU (Apple MPS / CUDA) kernel via torch, for very large RoA sweeps.
torch = ["torch>=2.2"]
# Model-based SOS comparison baseline (pure Python; MOSEK optional).
sos = ["SumOfSquares>=1.2", "picos>=2.4", "cvxopt>=1.3", "sympy>=1.11"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/NetDLab/pyddrv"
Lab = "https://mallada.ece.jhu.edu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# torchtyping (present in some envs) autoloads a pytest plugin that imports
# torch before conftest runs; its bundled libomp can clash with conda's.
# Harmless when torchtyping is not installed.
addopts = "-p no:torchtyping"
testpaths = ["tests"]
pythonpath = ["src"]
