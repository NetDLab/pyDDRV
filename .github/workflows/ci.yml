name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        extras: ["dev", "jax,dev"]
        include:
          # Windows coverage (beta feedback): NumPy-only and JAX-CPU paths,
          # on the Python version our first Windows user runs (3.11).
          - os: windows-latest
            python-version: "3.11"
            extras: "dev"
          - os: windows-latest
            python-version: "3.11"
            extras: "jax,dev"
    name: ${{ matrix.os }} py${{ matrix.python-version }} (${{ matrix.extras }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Test
        run: pytest -q
